services:
  db:
    image: postgres:15-alpine
    container_name: quickorder_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: quickorder_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  order-service:
    build:
      context: ./order-service  # <-- AQUÍ INDICAMOS QUE BUSQUE ADENTRO DE LA CARPETA
      dockerfile: ../Dockerfile  # <-- Y QUE EL DOCKERFILE ESTÁ AFUERA EN LA RAÍZ
    container_name: quickorder_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password123
      - DB_NAME=quickorder_db
    depends_on:
      - db

volumes:
  pgdata: